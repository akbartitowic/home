name: Deploy Homepage

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to app source
        run: |
          sudo mkdir -p /opt/homeserver-infra/docker/app
          sudo rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            ./ /opt/homeserver-infra/docker/app/

      - name: Rebuild and restart next-home
        run: |
          cd /opt/homeserver-infra/docker
          sudo docker compose up -d --build next-home
